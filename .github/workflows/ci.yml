name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build
      - name: Worker bundle (dry run, no deploy)
        run: npx wrangler deploy --dry-run --outdir .worker-build
